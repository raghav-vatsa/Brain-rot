# Compiles both apps on GitHub's runners. This exists because neither app can
# be built on a Windows machine: Android needs the Android SDK, and iOS needs
# Xcode, which only runs on macOS. Pushing here is how you get a compiler.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  ios:
    name: iOS (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Built for a device SDK with signing off: the Screen Time frameworks are
      # device-only, and signing would need the Family Controls entitlement,
      # which is tied to a real developer account.
      - name: Build
        working-directory: ios
        run: |
          xcodebuild build \
            -project BrainRot.xcodeproj \
            -scheme BrainRot \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Downloadable from the run's summary page, installable on an Android
      # phone without any local toolchain.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-rot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
