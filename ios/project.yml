# XcodeGen spec. Generate the Xcode project with:
#     brew install xcodegen && cd ios && xcodegen generate
# The .xcodeproj is deliberately not committed: it is generated output, and
# four targets' worth of it is unreadable in a diff.
name: BrainRot

options:
  bundleIdPrefix: com.brainrot
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  BrainRot:
    type: application
    platform: iOS
    sources:
      - path: BrainRot
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainrot.detector
        PRODUCT_NAME: BrainRot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BrainRot/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainRot/BrainRot.entitlements
    dependencies:
      - target: BrainRotMonitor
      - target: BrainRotShield
      - target: BrainRotShieldAction

  # Wakes up when a watched app passes its threshold. Applies the shield and
  # posts the notification that carries the animated GIF.
  BrainRotMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: BrainRotMonitor
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainrot.detector.monitor
        PRODUCT_NAME: BrainRotMonitor
        INFOPLIST_FILE: BrainRotMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainRotMonitor/BrainRotMonitor.entitlements

  # Styles the blocking screen iOS draws over a shielded app.
  BrainRotShield:
    type: app-extension
    platform: iOS
    sources:
      - path: BrainRotShield
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainrot.detector.shield
        PRODUCT_NAME: BrainRotShield
        INFOPLIST_FILE: BrainRotShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainRotShield/BrainRotShield.entitlements

  # Handles the two buttons on that screen.
  BrainRotShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: BrainRotShieldAction
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainrot.detector.shieldaction
        PRODUCT_NAME: BrainRotShieldAction
        INFOPLIST_FILE: BrainRotShieldAction/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrainRotShieldAction/BrainRotShieldAction.entitlements

schemes:
  BrainRot:
    build:
      targets:
        BrainRot: all
    run:
      config: Debug
    archive:
      config: Release
